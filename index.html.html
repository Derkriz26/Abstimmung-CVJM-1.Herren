<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Man of the Match - Voting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            overflow: hidden; /* Ensure everything fits without scrolling */
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .player-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .player-card:hover {
            transform: translateY(-2px);
            border-color: rgba(59, 130, 246, 0.5);
        }
        .player-card.selected {
            background: rgba(59, 130, 246, 0.2);
            border-color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }
        /* Custom scrollbar optimized for touch grid */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
    </style>
</head>
<body class="p-2 md:p-4 flex flex-col justify-between select-none">

    <!-- Header -->
    <header class="text-center py-1 flex-shrink-0">
        <div class="inline-flex items-center gap-2 px-3 py-0.5 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-[11px] font-semibold uppercase tracking-wider mb-1">
            <svg class="w-3 h-3 animate-pulse" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.683-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1.001 1.001 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
            Man of the Match
        </div>
        <h1 class="text-lg md:text-xl font-bold tracking-tight text-white" id="main-title">Stimme ab!</h1>
        <p class="text-slate-400 text-xs" id="vote-counter-label">Stimme <span id="current-voter" class="text-blue-400 font-bold">1</span> von <span id="total-voters">18</span> läuft verdeckt</p>
    </header>

    <!-- Main Container (Voting Grid & Result View) -->
    <main class="flex-grow flex flex-col justify-center max-w-5xl mx-auto w-full my-1 overflow-hidden">
        
        <!-- Voting View -->
        <div id="voting-view" class="flex flex-col h-full justify-between">
            <!-- Player Grid (Compact columns to fit all 19 players without scrolling if possible, or clean scroll) -->
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2 overflow-y-auto max-h-[72vh] p-1" id="player-grid">
                <!-- Injected via JS -->
            </div>

            <!-- Feedback Toast / Subdued notification (no modal, auto-fading quick feedback) -->
            <div class="h-6 flex items-center justify-center flex-shrink-0">
                <div id="quick-feedback" class="text-[11px] font-medium text-emerald-400 opacity-0 transition-opacity duration-300 bg-emerald-500/10 px-3 py-0.5 rounded-full border border-emerald-500/20">
                    ✓ Stimme erfasst! Nächster Spieler...
                </div>
            </div>

            <!-- Action Footer inside Voting View -->
            <div class="flex items-center justify-between pt-2 border-t border-slate-800 flex-shrink-0">
                <div class="text-[11px] text-slate-400 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>
                    Auswahl bleibt unsichtbar
                </div>
                <button onclick="finishVoting()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-xl shadow-lg shadow-blue-600/30 transition-all flex items-center gap-2">
                    <span>Auswertung anzeigen</span>
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
                </button>
            </div>
        </div>

        <!-- Result View (Hidden by default) -->
        <div id="result-view" class="hidden flex-col h-full justify-center items-center text-center animate-fade-in">
            <div class="glass-card p-5 md:p-6 rounded-3xl max-w-md w-full border border-slate-700 shadow-2xl relative overflow-hidden">
                <div class="absolute -top-12 -right-12 w-32 h-32 bg-amber-500/10 rounded-full blur-2xl"></div>
                
                <div class="w-14 h-14 bg-amber-500/20 border border-amber-500/40 rounded-2xl flex items-center justify-center mx-auto mb-3 text-amber-400 shadow-inner">
                    <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.683-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1.001 1.001 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                </div>

                <span class="text-[11px] uppercase tracking-widest text-amber-400 font-bold block mb-1">Man of the Match</span>
                <h2 id="winner-name" class="text-xl md:text-2xl font-extrabold text-white mb-1">Spieler Name</h2>
                <div id="winner-stats" class="inline-block px-3 py-1 bg-slate-800/80 rounded-full text-slate-300 text-xs mb-4 border border-slate-700">
                    Nummer X • X Stimmen (Y%)
                </div>

                <!-- Top 3 Mini Breakdown -->
                <div class="bg-slate-900/50 rounded-xl p-3 mb-4 text-left border border-slate-800/80">
                    <p class="text-[11px] font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">Top-Plazierungen</p>
                    <div id="top-three-list" class="space-y-1 text-xs">
                        <!-- Populated via JS -->
                    </div>
                </div>

                <div class="flex gap-3 justify-center">
                    <button onclick="resetVoting()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700 transition-all">
                        Neu starten / Reset
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer / Info -->
    <footer class="text-center text-slate-500 text-[10px] flex-shrink-0 pt-1">
        Spieler-Voting-Tool • Verdeckte Stimmabgabe ohne Quittierung
    </footer>

    <script>
        // Exakte Spielerliste aus der Anfrage
        const players = [
            { id: 1, name: "Arthur Gartung", number: "93" },
            { id: 2, name: "Jan Herhaus", number: "15" },
            { id: 3, name: "Lennart Frielingsdorf", number: "99" },
            { id: 4, name: "Dario Barth", number: "2" },
            { id: 5, name: "Julian Klein", number: "44" },
            { id: 6, name: "Johannes Schneevogt", number: "11" },
            { id: 7, name: "Phil Nückel", number: "9" },
            { id: 8, name: "Moritz Madel", number: "8" },
            { id: 9, name: "Frederik Schneider", number: "13" },
            { id: 10, name: "Max Meinerzhagen", number: "5" },
            { id: 11, name: "JP Sträßer", number: "33" },
            { id: 12, name: "Daniel Rischikov", number: "7" },
            { id: 13, name: "Leon Binder", number: "75" },
            { id: 14, name: "Severin Schreiber", number: "23" },
            { id: 15, name: "Leo Dietrich", number: "–" },
            { id: 16, name: "Anton Mosen", number: "–" },
            { id: 17, name: "Daniel Canisius", number: "1" },
            { id: 18, name: "Lukas Kirchner", number: "16" },
            { id: 19, name: "Chris Koch", number: "26" }
        ];

        const TOTAL_VOTERS = 18; // Ziel: ca. 14-25 Stimmabgaben (Standard: 18)
        let currentVoterIndex = 1;
        let votes = {}; 
        players.forEach(p => votes[p.id] = 0);

        function renderGrid() {
            const grid = document.getElementById('player-grid');
            grid.innerHTML = '';
            players.forEach(p => {
                const card = document.createElement('div');
                card.className = "player-card glass-card p-2 rounded-xl cursor-pointer flex items-center justify-between border border-slate-700/60";
                card.onclick = () => castVote(p.id, card);
                card.innerHTML = `
                    <div class="flex items-center gap-2 min-w-0">
                        <div class="w-7 h-7 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-xs text-blue-400 flex-shrink-0">
                            ${p.number}
                        </div>
                        <div class="min-w-0">
                            <h3 class="font-medium text-xs text-white truncate">${p.name}</h3>
                        </div>
                    </div>
                    <div class="w-4 h-4 rounded-full border border-slate-600 flex items-center justify-center text-[9px] text-slate-500 flex-shrink-0">
                        ✓
                    </div>
                `;
                grid.appendChild(card);
            });
            document.getElementById('total-voters').innerText = TOTAL_VOTERS;
            document.getElementById('current-voter').innerText = currentVoterIndex;
        }

        function castVote(playerId, cardElement) {
            votes[playerId]++;

            // Kurzes visuelles Feedback auf der Karte
            cardElement.classList.add('selected');
            setTimeout(() => {
                cardElement.classList.remove('selected');
            }, 250);

            // Kurzer Toast ohne Quittierung
            const feedback = document.getElementById('quick-feedback');
            feedback.style.opacity = '1';
            setTimeout(() => {
                feedback.style.opacity = '0';
            }, 1000);

            currentVoterIndex++;
            if (currentVoterIndex > TOTAL_VOTERS) {
                finishVoting();
            } else {
                document.getElementById('current-voter').innerText = currentVoterIndex;
            }
        }

        function finishVoting() {
            document.getElementById('voting-view').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');
            document.getElementById('main-title').innerText = "Ergebnis der Spieler-Wahl";
            document.getElementById('vote-counter-label').innerText = "Alle Stimmen erfolgreich verdeckt erfasst";

            let sorted = [...players].sort((a, b) => votes[b.id] - votes[a.id]);
            let winner = sorted[0];
            let totalVotesCast = Object.values(votes).reduce((a, b) => a + b, 0);
            let winnerPercentage = totalVotesCast > 0 ? Math.round((votes[winner.id] / totalVotesCast) * 100) : 0;

            document.getElementById('winner-name').innerText = winner.name;
            document.getElementById('winner-stats').innerText = `Nummer ${winner.number} • ${votes[winner.id]} Stimmen (${winnerPercentage}%)`;

            const topList = document.getElementById('top-three-list');
            topList.innerHTML = '';
            sorted.slice(0, 3).forEach((p, idx) => {
                const row = document.createElement('div');
                row.className = "flex items-center justify-between text-slate-300 py-0.5";
                row.innerHTML = `
                    <span class="flex items-center gap-2">
                        <span class="font-bold text-slate-400">#${idx + 1}</span>
                        <span class="truncate">${p.name} (${p.number})</span>
                    </span>
                    <span class="font-semibold text-blue-400">${votes[p.id]} St.</span>
                `;
                topList.appendChild(row);
            });
        }

        function resetVoting() {
            currentVoterIndex = 1;
            players.forEach(p => votes[p.id] = 0);
            document.getElementById('result-view').classList.add('hidden');
            document.getElementById('voting-view').classList.remove('hidden');
            document.getElementById('main-title').innerText = "Stimme ab!";
            renderGrid();
        }

        renderGrid();
    </script>
</body>
</html>
