<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Man of the Match - Voting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            overflow: hidden;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .player-card {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent !important;
            user-select: none;
            cursor: pointer;
        }
        .player-card:hover {
            transform: translateY(-2px);
            border-color: rgba(59, 130, 246, 0.5);
        }
        .player-card.selected {
            background: rgba(59, 130, 246, 0.25) !important;
            border-color: #3b82f6 !important;
        }
        button {
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
    </style>
</head>
<body class="p-3 md:p-5 flex flex-col justify-between select-none">

    <!-- Header mit Auswertungs-Button oben -->
    <header class="text-center py-1 flex-shrink-0">
        <div class="flex items-center justify-between mb-1">
            <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-[10px] font-semibold uppercase tracking-wider">
                <svg class="w-2.5 h-2.5 animate-pulse" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.683-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1.001 1.001 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                MotM

            <button onclick="showResults()" class="px-3 py-1 bg-blue-600 hover:bg-blue-500 text-white text-[11px] font-semibold rounded-lg shadow-md shadow-blue-600/30 transition-all flex items-center gap-1.5">
                <span>Ergebnis</span>
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
            </button>
        </div>
        
        <h1 class="text-base md:text-lg font-bold tracking-tight text-white" id="main-title">Stimme ab!</h1>
        <p class="text-slate-400 text-[11px]" id="vote-counter-label">Bereits <span id="total-votes-count" class="text-blue-400 font-bold">0</span> Stimmen abgegeben (verdeckt)</p>
    </header>

    <!-- Main Container -->
    <main class="flex-grow flex flex-col justify-center max-w-5xl mx-auto w-full my-1 overflow-hidden">
        
        <!-- Voting View -->
        <div id="voting-view" class="flex flex-col h-full justify-between">
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2 overflow-y-auto p-1 max-h-[70vh]" id="player-grid">
                <!-- Injected via JS -->
            </div>

            <div class="h-6 flex items-center justify-center flex-shrink-0 pt-1">
                <div id="quick-feedback" class="text-[11px] font-medium text-emerald-400 opacity-0 transition-opacity duration-300 bg-emerald-500/10 px-3 py-0.5 rounded-full border border-emerald-500/20">
                    ✓ Stimme gezählt! Nächster bitte...
                </div>
            </div>
        </div>

        <!-- Result View -->
        <div id="result-view" class="hidden flex-col h-full justify-center items-center text-center animate-fade-in my-auto">
            <div class="glass-card p-5 md:p-6 rounded-3xl max-w-md w-full border border-slate-700 shadow-2xl relative overflow-hidden">
                <div class="absolute -top-12 -right-12 w-32 h-32 bg-amber-500/10 rounded-full blur-2xl"></div>
                
                <div class="w-14 h-14 bg-amber-500/20 border border-amber-500/40 rounded-2xl flex items-center justify-center mx-auto mb-3 text-amber-400 shadow-inner">
                    <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.683-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1.001 1.001 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                </div>

                <span class="text-[11px] uppercase tracking-widest text-amber-400 font-bold block mb-1">Man of the Match</span>
                <h2 id="winner-name" class="text-xl md:text-2xl font-extrabold text-white mb-1">Noch keine Stimmen</h2>
                <div id="winner-stats" class="inline-block px-3 py-1 bg-slate-800/80 rounded-full text-slate-300 text-xs mb-4 border border-slate-700">
                    0 Stimmen insgesamt
                </div>

                <div class="bg-slate-900/50 rounded-xl p-3 mb-4 text-left border border-slate-800/80">
                    <p class="text-[11px] font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">Top-Plazierungen</p>
                    <div id="top-three-list" class="space-y-1 text-xs text-slate-400">
                        Noch keine Daten vorhanden.
                    </div>
                </div>

                <div class="flex gap-3 justify-center">
                    <button onclick="backToVoting()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-xl shadow-lg shadow-blue-600/30 transition-all">
                        ← Weiter abstimmen
                    </button>
                    <button onclick="resetVoting()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700 transition-all">
                        Neu starten / Reset
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center text-slate-500 text-[10px] flex-shrink-0 pt-1">
        Spieler-Voting-Tool • Unbegrenzte verdeckte Stimmabgabe
    </footer>

        players.forEach(p => votes[p.id] = 0);

        function renderGrid() {
            const grid = document.getElementById('player-grid');
            grid.innerHTML = '';
            players.forEach(p => {
                // Wieder zurück zu <div>, da divs niemals einen Browser-Fokusrahmen erzeugen können!
                const card = document.createElement('div');
                card.className = "player-card glass-card p-2 rounded-xl flex items-center justify-between border border-slate-700/60";
                
                card.onclick = () => castVote(p.id, card);

                card.innerHTML = `
                    <div class="flex items-center gap-2 min-w-0 pointer-events-none">
                        <div class="w-7 h-7 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-xs text-blue-400 flex-shrink-0">
                            ${p.number}
                        </div>
                        <div class="min-w-0">
                            <h3 class="font-medium text-xs text-white truncate">${p.name}</h3>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            document.getElementById('total-votes-count').innerText = totalVotesCast;
        }

        function castVote(playerId, cardElement) {
            votes[playerId]++;
            totalVotesCast++;

            // Kurzes Aufblinken beim Antippen
            cardElement.classList.add('selected');
            setTimeout(() => {
                cardElement.classList.remove('selected');
            }, 150);

            // Feedback unten einblenden
            const feedback = document.getElementById('quick-feedback');
            feedback.style.opacity = '1';
            setTimeout(() => {
                feedback.style.opacity = '0';
            }, 1000);

            document.getElementById('total-votes-count').innerText = totalVotesCast;
        }

        function showResults() {
            document.getElementById('voting-view').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');
            document.getElementById('main-title').innerText = "Ergebnis der Spieler-Wahl";

            if (totalVotesCast === 0) {
                document.getElementById('winner-name').innerText = "Noch keine Stimmen";
